# Construit l'APK Android signé et le publie dans une « Release » GitHub.
# Déclenchement : une étiquette de version (ex. v1.0.0) ou manuellement depuis l'onglet Actions.
name: APK Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Le SDK Android est préinstallé sur les machines ubuntu de GitHub (ANDROID_HOME, licences acceptées).

      - name: Clé de signature (secrets du dépôt)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/atelier-cvcd.p12"

      - name: Construire l'APK signé
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/atelier-cvcd.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="$(node -p "require('../package.json').version")"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | head -3
          mkdir -p ../release
          cp "$APK" "../release/atelier-cvcd-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: release/*.apk

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Une version avec suffixe (v1.1.0-beta.1) est publiée en pré-version, à part des releases stables.
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/*.apk $PRE \
            --title "Atelier CVCD $GITHUB_REF_NAME" \
            --notes "APK Android. Sur le téléphone : ouvrir ce fichier .apk, autoriser l'installation, puis installer. Les mises à jour s'installent par-dessus en gardant les dernières valeurs saisies."
